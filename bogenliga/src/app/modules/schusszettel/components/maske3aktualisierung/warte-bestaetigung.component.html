<div *ngIf="infos" class="warte-container" role="status" aria-live="polite">
  <bla-match-kontext [infos]="infos"></bla-match-kontext>

  <div class="info-box">
    <mat-spinner diameter="40" aria-hidden="true"></mat-spinner>
    <p id="wait-msg">Das System hat deine Satzeingabe erhalten! </p>
    <br/>
    <p>... Das Gegnerteam ist noch nicht fertig mit seiner Eingabe. </p>
    <br/>
    <p>Drücke den Knopf unter dir, wenn du denkst, dass
    Sie fertig sind.</p>
  </div>


  <button
    mat-raised-button
    color="primary"
    (click)="onRefreshClick()"
    aria-labelledby="wait-msg"
    class="refresh-button"
  >
    Nochmal nachfragen, ob es weitergehen kann.
  </button>
</div>
