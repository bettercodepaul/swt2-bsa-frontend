<div class="not-allowed-container" role="main">
  <!-- match header ALWAYS first -->
  <bla-match-kontext [infos]="infos"></bla-match-kontext>

  <!-- alert card ALWAYS second -->
  <div class="message-box" role="alert" aria-live="assertive">
    <h2>Das System hat nicht genug Zielwasser getrunken.</h2>
    <p>
      Bitte lade die Seite nochmal, scan den QR-Code erneut oder kontaktiere jemand Verantwortlichen.
    </p>
    <button
      mat-raised-button
      color="warn"
      (click)="retry()"
    >
      Nochmal versuchen
    </button>
  </div>
</div>
