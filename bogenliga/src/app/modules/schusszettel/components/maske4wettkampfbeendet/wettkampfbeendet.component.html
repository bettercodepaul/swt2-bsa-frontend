<div *ngIf="infos" class="wettkampfbeendet-container">

  <!-- Shared header for context -->
  <bla-match-kontext [infos]="infos"></bla-match-kontext>

  <div class="message-box" role="status" aria-live="polite">
    <h2>Competition Finished</h2>
    <p>The match is complete. Final team match points:</p>

    <div class="result-table-wrapper">
      <table class="result-table">
        <caption class="visually-hidden">Final team match points</caption>
        <thead>
        <tr>
          <th scope="col">Team</th>
          <th scope="col">Match Points</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let t of infos.matchErgebnis">
          <td>{{ t.teamName }}</td>
          <td>{{ t.matchpunkte }}</td>
        </tr>
        </tbody>
      </table>
    </div>

    <button
      mat-raised-button
      color="primary"
      (click)="reload()"
      class="reload-button"
    >
      Start Again
    </button>
  </div>
</div>
