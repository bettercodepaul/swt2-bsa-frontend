<div class="wettkampfbeendet-container" role="main">

    <h2>Der Wettkampftag ist beendet</h2>
    <p>Das System hat keine weiteren Matches für Sie gefunden.</p>
    
    <div class="button-container">
      <button

        (click)="onWeiter()"

        class="weiter-button">
        Weiter
      </button>
    </div>
  </div>
</div>
