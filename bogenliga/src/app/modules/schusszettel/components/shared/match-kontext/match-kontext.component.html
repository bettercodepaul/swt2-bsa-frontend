<!-- only render once infos is available -->
<div *ngIf="infos" class="match-kontext" role="group" aria-labelledby="mk-heading">
  <div class="title-block">

    <!-- use definition list for semantic labels -->
    <dl>
      <dt>Team</dt>
      <dd>{{ infos.eigenesTeam.teamName }}</dd>

      <dt>Date</dt>
      <dd>{{ today | date: 'dd.MM.yyyy' }}</dd>

      <dt>Opponent</dt>
      <dd>{{ infos.gegnerischesTeam.teamName }}</dd>
    </dl>
  </div>
</div>
