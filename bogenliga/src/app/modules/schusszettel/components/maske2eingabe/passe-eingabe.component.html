<div *ngIf="infos?.schuetzeStammDaten?.length; else loading" class="schusszettel-container" role="main">
  <bla-match-kontext [infos]="infos"></bla-match-kontext>

  <div class="passe-info">
    <h2>Passe {{ currentPasse }}</h2>
  </div>

  <form *ngIf="form" [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="table-wrapper">
      <table class="treffer-table">
        <caption class="visually-hidden">
          Treffer-Eingabe für jeden Schützen – zwei Schüsse pro Passe
        </caption>
        <thead>
        <tr>
          <th scope="col">Schütze</th>
          <th scope="col">Rückennr.</th>
          <th scope="col">Schuss&nbsp;1</th>
          <th scope="col">Schuss&nbsp;2</th>
        </tr>
        </thead>
        <tbody formArrayName="schuesse" cdkDropList (cdkDropListDropped)="onRowDrop($event)">
        <tr
          *ngFor="let grp of schuesse.controls; let i = index; trackBy: trackByShooter"
          [formGroupName]="i"
          [class.active-row]="activeRow === i"
          cdkDrag
          class="draggable-row"
        >
          <td class="drag-handle">
            <span cdkDragHandle class="drag-icon">⋮⋮</span>
            {{ orderedShooters[i]?.vorname }}
            {{ orderedShooters[i]?.nachname }}
          </td>
          <td>{{ orderedShooters[i]?.rueckennummer }}</td>

          <td>

            <label class="visually-hidden" for="schuss1-{{ i }}">
              Schuss 1
            </label>
            <input
              #inputField
              id="schuss1-{{ i }}"
              type="number"
              inputmode="numeric"
              formControlName="schuss1"
              min="0"
              max="10"
              (focus)="onFocusRow(i)"
              (blur)="onBlurRow()"
              (input)="onInputDelay(i, 'schuss1')"
            />
            <div class="error" *ngIf="schuesse.at(i).get('schuss1')?.invalid && schuesse.at(i).get('schuss1')?.touched">
              0–10
            </div>
          </td>

          <td>
            <label class="visually-hidden" for="schuss2-{{ i }}">
              Schuss 2
            </label>
            <input
              #inputField
              id="schuss2-{{ i }}"
              type="number"
              inputmode="numeric"
              formControlName="schuss2"
              min="0"
              max="10"
              (focus)="onFocusRow(i)"
              (blur)="onBlurRow()"
              (input)="onInputDelay(i, 'schuss2')"
            />
            <div class="error" *ngIf="schuesse.at(i).get('schuss2')?.invalid && schuesse.at(i).get('schuss2')?.touched">
              0–10
            </div>
          </td>
        </tr>
        </tbody>
      </table>
    </div>

    <button #confirmButton mat-raised-button color="primary" type="submit" [disabled]="form.invalid" class="confirm-button">
      Eingabe bestätigen <span class="arrow">→</span>
    </button>
  </form>
</div>

<ng-template #loading>
  <div class="loading-container"><p>Lade Schützendaten …</p></div>
</ng-template>
