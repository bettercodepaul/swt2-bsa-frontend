<div class="schusszettel-container">

  <bla-match-kontext [infos]="infos"></bla-match-kontext>

  <div class="info-box">
    Select a field, then click a shooter from the list to fill its ID.
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="register-layout">

      <!-- Shooter List with Filter -->
      <div class="schuetzen-list">
        <input
          formControlName="filter"
          placeholder="Filter shooters…"
          aria-label="Filter shooters"
        />
        <div class="list">
          <div
            *ngFor="let sh of filteredShooters; trackBy: trackById"
            class="schuetze-item"
            tabindex="0"
            (click)="selectShooter(sh)"
            (keydown.enter)="selectShooter(sh)"
          >
            {{ sh.schuetzenId }} – {{ sh.name }}
          </div>
        </div>
      </div>

      <!-- ID Input Slots -->
      <div class="input-grid" formArrayName="ids">
        <div *ngFor="let ctrl of ids.controls; let i = index">
          <input
            [formControlName]="i"
            type="text"
            placeholder="Slot {{ i + 1 }} ID"
            aria-label="Rückennummer slot {{ i + 1 }}"
            (focus)="setActiveInput(i)"
          />
          <div
            class="error"
            *ngIf="ctrl.invalid && ctrl.touched"
          >
            Enter a valid numeric ID
          </div>
        </div>
      </div>

    </div>

    <button
      type="submit"
      [disabled]="form.invalid"
      class="confirm-button"
    >
      <img
        src="assets/img/Icons/bestaetigen-button.png"
        alt="Bestaetigen-Button"
        style="width: 170px; height: 80px;"
      />
    </button>
  </form>
</div>
