<!-- maske4zustand.component.html -->
<div *ngIf="infos" class="maske4-zustand" role="main">
  <bla-match-kontext [infos]="infos"></bla-match-kontext>

  <section class="schusszettel-section">
    <bla-schusszettel-wrapper
      *ngIf="canViewSchusszettel()"
      [infos]="infos">
    </bla-schusszettel-wrapper>

    <div *ngIf="!canViewSchusszettel()" class="permission-message">
      <p>Sie haben nicht die erforderlichen Berechtigungen, um den derzeitigen Schusszettel hier anzuzeigen.</p>
    </div>
  </section>

  <button
    mat-raised-button
    color="primary"
    (click)="onWeiter()"
    aria-label="Continue to next screen"
  >
    Weiter
  </button>
</div>
