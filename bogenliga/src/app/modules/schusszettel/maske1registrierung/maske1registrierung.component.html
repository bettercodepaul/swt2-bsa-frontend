<div class="schusszettel-container">
  <div class="info-box">Tragen Sie hier mit einem Tap auf die Boxen die Rückennummern der Schützen ein, und bestätigen Sie</div>
  <div class="title-block">
    <h1>Rückennummern</h1>
    <p>Team : _______<br>Datum : _______<br>Match vs.: _______</p>
  </div>
  <div class="input-grid">
    <input type="text" [(ngModel)]="rueckennummern[0]" placeholder="Schütze 1" class="shooter red">
    <input type="text" [(ngModel)]="rueckennummern[1]" placeholder="Schütze 2" class="shooter blue">
    <input type="text" [(ngModel)]="rueckennummern[2]" placeholder="Schütze 3" class="shooter yellow">
  </div>
  <button class="confirm-button" (click)="confirmInput()">
    EINGABE BESTÄTIGEN
    <span class="arrow">→</span>
  </button>
</div>
