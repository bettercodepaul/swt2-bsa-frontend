<div class="anzeige-manager-container">

  <div class="header-section">
    <div class="match-navigation">
      <button
        class="action-btn action-btn-primary match-button"
        [disabled]="currentMatch <= 1"
        (click)="previousMatch()"
        title="Vorherige Anzeige">
        &#9664;
      </button>

      <div class="match-number">
        {{ currentMatch }}
      </div>

      <button
        class="action-btn action-btn-primary match-button"
        (click)="nextMatch()"
        title="Nächste Anzeige">
        &#9654;
      </button>
    </div>
  </div>


  <div *ngIf="displays.length > 0">
    <div *ngFor="let display of displays; let i = index">

      <div class="display-config-section">
        <button
          class="action-btn action-btn-danger remove-button"
          (click)="removeDisplay(i)"
          title="Anzeige entfernen">
          <span class="action-btn-circle">-</span>
          Entfernen
        </button>

        <input
          #anzeigeIdInput
          class="display-id"
          type="text"
          [value]="display.physischeBildschirmId"
          (input)="display.physischeBildschirmId = anzeigeIdInput.value"
          maxlength="4"
          placeholder="----">

        <div>
          <select
            class="display-table-select"
            #anzeigenTabellenSelect
            [value]="display.tableTyp"
            (change)="display.tableTyp = anzeigenTabellenSelect.value">
            <option value="tabelle">Tabelle</option>
            <option value="1/2">(1/2)</option>
            <option value="3/4">(3/4)</option>
            <option value="5/6">(5/6)</option>
            <option value="7/8">(7/8)</option>
          </select>
        </div>

      </div>
    </div>


  </div>
  <button
    class="action-btn action-btn-success id-button"
    (click)="showGeneratedID()"
    title="ID generieren">
    <span class="action-btn-circle">+</span>
    ID generieren
  </button>
  <button
    class="action-btn action-btn-success update-button"
    (click)="updateDisplay()"
    title="Anzeige Übernehmen">
    <span class="action-btn-circle">+</span>
    Anzeige Übernehmen
  </button>
  <div class="add-button-section">
    <button
      class="action-btn action-btn-success add-button"
      (click)="addDisplay()">
      <span class="action-btn-circle">+</span>
      Anzeige hinzufügen
    </button>
  </div>

  <!-- Dunkles Overlay wie bei Fehlermeldung Popups-->
  <div class="id-popup" *ngIf="IdGeneratePopup" [ngStyle]="{'left.px': popupPosition.x, 'top.px': popupPosition.y}">

    <!-- Header (Titelleiste zum Verschieben) -->
    <div class="id-popup-header" (mousedown)="startDrag($event)">
      <div class="id-popup-title">
        Generierte ID
      </div>
      <button class="id-popup-close"
              (click)="closeGeneratedIdPopup()">
                ✕
      </button>
    </div>

    <!-- Body (Inhalt) -->
    <div class="id-popup-body">
      <div class="id-display">{{ generatedId || 'XXXX' }}</div>
    </div>

    <!-- Footer mit Button rechts -->
    <div class="id-popup-footer">
      <button class="action-btn action-btn-primary copy-button"
              (click)="copyGeneratedId()">
              <span class="action-btn-circle">+</span>
              Kopieren
      </button>
    </div>

  </div>
</div>
