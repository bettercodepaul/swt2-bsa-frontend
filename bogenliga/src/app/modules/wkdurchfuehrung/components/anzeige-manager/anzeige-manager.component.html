<div class="anzeige-manager-container">

  <div class="header-section">
    <div class="match-navigation">
      <button
        class="action-btn action-btn-primary match-button"
        [disabled]="aktuellesMatch <= 1"
        (click)="vorherigeAnzeige()"
        title="Vorherige Anzeige">
        &#9664;
      </button>

      <div class="match-number">
        {{ aktuellesMatch }}
      </div>

      <button
        class="action-btn action-btn-primary match-button"
        (click)="naechsteAnzeige()"
        title="Nächste Anzeige">
        &#9654;
      </button>
    </div>
  </div>


  <div *ngIf="anzeigen.length > 0">
    <div *ngFor="let anzeige of anzeigen">

      <div class="display-config-section">
        <button
          class="action-btn action-btn-danger remove-button"
          (click)="anzeigeEntfernen(anzeige.id)"
          title="Anzeige entfernen">
          <span class="action-btn-circle">-</span>
          Entfernen
        </button>

        <input
          #anzeigeIdInput
          class="display-id"
          type="text"
          [value]="anzeige.anzeigeId"
          (input)="anzeige.anzeigeId = anzeigeIdInput.value"
          maxlength="4"
          placeholder="----">

        <div>
          <select
            class="display-select"
            #anzeigenTabellenSelect
            [value]="anzeige.inhaltTyp"
            (change)="anzeige.inhaltTyp = anzeigenTabellenSelect.value">
            <option value="tabelle">Tabelle</option>
            <option value="1/2">(1/2)</option>
            <option value="3/4">(3/4)</option>
            <option value="5/6">(5/6)</option>
            <option value="7/8">(7/8)</option>
          </select>
        </div>
      </div>
    </div>

    <div class="add-button-section">
      <button
        class="action-btn action-btn-success add-button"
        (click)="anzeigeHinzufuegen()">
        <span class="action-btn-circle">+</span>
        Anzeige hinzufügen
      </button>
    </div>

  </div>
</div>
