<div class="match-container">
  <div class="match-header">
    <div class="logo-container">
      <img src="assets/img/Logos/BL_Logo/Logo-Rahmenlos/PNG/PNG_BL-Logo-Color.png"
           alt="bogenliga-logo" class="logo">
    </div>
    <div class="match-title">{{ matchName }}</div>
    <div class="time-box">
      <span class="clock-icon">🕒</span> {{ currentTime }}
    </div>
  </div>

  <div class="match-results-wrapper">
    <div class="results-box">

      <!-- Team 1 -->
      <div class="team-section">
        <div class="team-main-row">
          <div class="team-name-box">{{ team1Name }}</div>
          
          <div class="scores-group">
            <div *ngFor="let score of team1Scores" class="score-box">
              {{ score }}
            </div>
          </div>

          <div class="total-wrapper">
            <div class="label-top">Total</div>
            <div class="total-box">{{ team1Total }}</div>
          </div>
        </div>

        <div class="sp-row">
          <div class="label-left">SP</div>
          <div class="sp-box">{{ team1SetPoints }}</div>
        </div>
      </div>

      <!-- Team 2 -->
      <div class="team-section">
        <div class="team-main-row">
          <div class="team-name-box">{{ team2Name }}</div>
          
          <div class="scores-group">
            <div *ngFor="let score of team2Scores" class="score-box">
              {{ score }}
            </div>
          </div>

          <div class="total-wrapper">
            <div class="label-top">Total</div>
            <div class="total-box">{{ team2Total }}</div>
          </div>
        </div>

        <div class="sp-row">
          <div class="label-left">SP</div>
          <div class="sp-box">{{ team2SetPoints }}</div>
        </div>
      </div>

    </div>
  </div>
</div>
