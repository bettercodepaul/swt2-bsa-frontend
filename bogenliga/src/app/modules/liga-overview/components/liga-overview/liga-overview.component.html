<bla-common-dialog [config]="config">
  <div class="content">
    <div class="container-fluid">
      <div class="row">
        <div class="col">
          <div class="d-flex justify-content-between align-items-start mb-3">
            <p class="mb-0">{{ 'LIGAUEBERSICHT.DESCRIPTION' | translate }}</p>
            <button class="btn btn-outline-secondary btn-sm" (click)="onRefresh()" [disabled]="isLoading"
              [attr.aria-label]="'LIGAUEBERSICHT.REFRESH' | translate">
              <i class="fa fa-sync" [class.fa-spin]="isLoading" aria-hidden="true"></i>
              <span class="d-none d-md-inline ms-1">{{ 'LIGAUEBERSICHT.REFRESH' | translate }}</span>
            </button>
          </div>

          <!-- Deeplink Fehlermeldung -->
          <div class="alert alert-warning liga-deeplink-error" role="alert" *ngIf="deeplinkErrorMessage">
            <i class="fa fa-exclamation-triangle" aria-hidden="true"></i>
            <span>{{ deeplinkErrorMessage | translate }}</span>
          </div>

          <section class="liga-tree-section" [attr.aria-label]="'LIGAUEBERSICHT.TREE.TITLE' | translate">
            <!-- Loading State: Skeleton Loader -->
            <ng-container *ngIf="isLoading; else treeContent">
              <bla-tree-skeleton></bla-tree-skeleton>
            </ng-container>

            <ng-template #treeContent>
              <!-- Error State: 4xx/5xx/Timeout -->
              <ng-container
                *ngIf="hierarchyResult?.status === 'error' || hierarchyResult?.status === 'timeout'; else checkEmpty">
                <bla-error-state [messageKey]="statusMessageKey" [showRetry]="true" (retry)="onRetry()">
                </bla-error-state>
              </ng-container>

              <ng-template #checkEmpty>
                <!-- Empty State: No data -->
                <ng-container *ngIf="hierarchyResult?.status === 'empty'; else showTree">
                  <bla-empty-state [messageKey]="statusMessageKey" icon="fa-folder-open">
                  </bla-empty-state>
                </ng-container>
              </ng-template>

              <ng-template #showTree>
                <!-- Success State: Tree with data -->
                <ng-container *ngIf="treeNodes.length > 0">
                  <div class="liga-tree-wrapper">
                    <bla-league-tree [nodes]="treeNodes" [selectedId]="selectedLigaId"
                      [initialExpandedIds]="initialExpandedIds" (select)="onTreeSelect($event)"
                      (expandedIdsChange)="onExpandedIdsChange($event)">
                    </bla-league-tree>
                  </div>
                  <!-- Statushinweis für offline-fallback -->
                  <div class="alert alert-info liga-tree-state" role="alert"
                    *ngIf="hierarchyResult?.status === 'offline-fallback'">
                    <i class="fa fa-info-circle" aria-hidden="true"></i>
                    <span>{{ statusMessageKey | translate }}</span>
                  </div>
                  <!-- Nicht-blockierender Hinweis aus Deeplink-Validierung -->
                  <div class="alert alert-warning liga-tree-state" role="alert" *ngIf="deeplinkMessageKey as dmk">
                    <i class="fa fa-exclamation-triangle" aria-hidden="true"></i>
                    <span>{{ dmk | translate }}</span>
                  </div>
                </ng-container>
              </ng-template>
            </ng-template>
          </section>
        </div>
      </div>
    </div>
  </div>
</bla-common-dialog>
