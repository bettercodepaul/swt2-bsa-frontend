<bla-navigation-dialog [config]="config">
  <div class="mannschaftsuebersicht-page">

    <!-- Loading indicator -->
    <div *ngIf="loading">{{"MANNSCHAFTSUEBERSICHT.STATUS.LOADING" | translate}}</div>

    <!-- Mannschaft anzeigen -->
    <div *ngIf="!loading && mannschaft">
      <h2>{{ mannschaft.name || 'unbenannte Mannschaft' }} <small *ngIf="mannschaft.nummer">(Nr. {{ mannschaft.nummer }})</small></h2>
    </div>
  </div>
</bla-navigation-dialog>
